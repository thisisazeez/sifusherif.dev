services:

  # ── Django / Gunicorn ───────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nightly DB Backup ────────────────────────────────────────
  backup:
    image: alpine:3.20
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data:ro
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
    command: >
      sh -c "
        apk add --no-cache sqlite bash curl coreutils &&
        chmod +x /usr/local/bin/backup_db.sh &&
        echo '0 2 * * * backup_db.sh >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      - web

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local
